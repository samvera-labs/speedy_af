volumes:
  fedora:
  solr:

services:
  fedora:
    image: ghcr.io/samvera/fcrepo4:4.7.5
    volumes:
      - fedora:/data
    ports:
      - '8986:8080'

  solr:
    image: solr:9
    volumes:
      - ./solr/conf:/opt/solr/core_conf
      - solr:/var/solr
    command:
      - solr-precreate
      - hydra-test
      - /opt/solr/core_conf
    environment:
      - SOLR_MODULES=analysis-extras,extraction
    ports:
      - '8985:8983'

