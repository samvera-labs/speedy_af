version: 2.1
orbs:
  samvera: samvera/circleci-orb@1
jobs:
  bundle_and_test:
    parameters:
      ruby_version:
        type: string
      rails_version:
        type: string
      bundler_version:
        type: string
        default: 2.5.18
      ffmpeg_version:
        type: string
        default: 4.1.4
    executor:
      name: 'samvera/ruby_fcrepo_solr'
      ruby_version: << parameters.ruby_version >>
      solr_version: 8-slim
    environment:
      RAILS_VERSION: << parameters.rails_version >>
    working_directory: ~/project
    steps:
      - samvera/cached_checkout

      - samvera/bundle:
          ruby_version: << parameters.ruby_version >>
          bundler_version: << parameters.bundler_version >>

      - samvera/rubocop

      - samvera/install_solr_core

      - samvera/parallel_rspec

workflows:
  ci:
    jobs:
      - bundle_and_test:
          name: "ruby4-0_rails8-1"
          ruby_version: "4.0.2"
          rails_version: "8.1.3"
      - bundle_and_test:
          name: "ruby4-0_rails8-0"
          ruby_version: "4.0.2"
          rails_version: "8.0.5"
      - bundle_and_test:
          name: "ruby3-4_rails8-0"
          ruby_version: "3.4.9"
          rails_version: "8.0.5"
      - bundle_and_test:
          name: "ruby3-3_rails8-0"
          ruby_version: "3.3.11"
          rails_version: "8.0.5"
      - bundle_and_test:
          name: "ruby3-3_rails7-2"
          ruby_version: "3.3.11"
          rails_version: "7.2.3.1"
